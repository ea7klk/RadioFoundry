#
# Refreshes the Builder tab's data snapshots (site/static/js/codeplug/builder/data) and commits them.
#
# Brandmeister sends no CORS headers, so the page cannot read its talkgroups or its repeaters, and HearHam's dump is
# 10 MB: the lists ship as committed modules (site/rfoundrysite/builder_data.py). This workflow keeps them current.
#
# The per-repeater static talkgroups are one request each and Brandmeister answers 429 with a Retry-After of a minute
# or more, so a full pass takes hours. Every answer is kept in build/builder-cache (a cache entry here), a run resumes
# from it, and --talkgroup-budget caps what one run asks for, so the job stays inside its time limit and the next
# Monday continues. A repeater with no list yet is left out of the snapshot, and the page falls back to that
# repeater's national talkgroup.
name: builder-data

on:
  schedule:
    - cron: "17 3 * * 1"    # Mondays, 03:17 UTC
  workflow_dispatch:
    inputs:
      budget:
        description: "Most new per-repeater talkgroup requests this run"
        default: "600"

permissions:
  contents: write

concurrency:
  group: builder-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: true   # this job commits the snapshots back
          submodules: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"

      - name: Restore the upstream answers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: build/builder-cache
          key: builder-cache-${{ github.run_id }}
          restore-keys: builder-cache-

      - name: Refresh the snapshots
        env:
          BUDGET: ${{ github.event.inputs.budget || '600' }}
        run: python3 site/rfoundrysite/builder_data.py --talkgroup-budget "$BUDGET"

      - name: Keep the answers for the next run
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: build/builder-cache
          key: builder-cache-${{ github.run_id }}

      - name: The modules load
        run: |
          set -eu
          for f in site/static/js/codeplug/builder/data/*.js; do node --check "$f"; done

      - name: Commit when the data changed
        run: |
          set -eu
          if git diff --quiet -- site/static/js/codeplug/builder/data; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/static/js/codeplug/builder/data
          git commit -m "Refresh the Builder tab's data snapshots"
          git push
