# Refreshes the Builder tab's data snapshots (site/static/js/codeplug/builder/data/)
# and commits them.
#
# Brandmeister sends no CORS headers, so a page cannot read its talkgroup list or
# its repeaters, and HearHam's dump is 10 MB. The snapshots are therefore
# committed, and this workflow keeps them current.
#
# The per-repeater static talkgroups are one request per repeater and Brandmeister
# throttles them with a 429 and a Retry-After of a minute or more, so a full pass
# takes many hours. Every answer is cached under build/builder-cache/, which this
# workflow keeps between runs (actions/cache) and which the script resumes from;
# TALKGROUP_MINUTES caps a run so it never approaches the job's time limit.
name: builder-data

on:
  schedule:
    - cron: "17 3 * * 1"	# Mondays, 03:17 UTC
  workflow_dispatch:
    inputs:
      budget:
        description: "Most new per-repeater talkgroup requests this run"
        default: "600"

permissions:
  contents: write

concurrency:
  group: builder-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # the data modules are the only thing this job writes
          sparse-checkout: |
            site
            boards
            config
            platform
            boot
            docs
            tools
            Makefile
            LICENSE
            AUTHORS
            CONTRIBUTORS
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the upstream answers
        uses: actions/cache@v4
        with:
          path: build/builder-cache
          key: builder-cache-${{ github.run_id }}
          restore-keys: builder-cache-

      - name: Refresh the snapshots
        env:
          BUDGET: ${{ github.event.inputs.budget || '600' }}
        run: python3 site/rfoundrysite/builder_data.py --talkgroup-budget "$BUDGET"

      - name: Check the modules load
        run: |
          for f in site/static/js/codeplug/builder/data/*.js; do node --check "$f"; done

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- site/static/js/codeplug/builder/data; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/static/js/codeplug/builder/data
          git commit -m "Refresh the Builder tab's data snapshots"
          git push
